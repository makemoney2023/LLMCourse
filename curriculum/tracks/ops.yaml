id: ops
label: Operations
modules:
  deep-research:
    story: "You're rewriting a ticket triage playbook, and folklore rules keep sneaking back in."
    exampleAsk: "Research our current SLA docs, and write a BRIEF.md where every claim has a citation."
    watchOut: "Paste policy links into SOURCES.md, not into your wall rules."
  tools-and-mcp:
    story: "Agents keep opening the wrong queue search."
    exampleAsk: "Allow the helper to read the wiki and search tickets. Never let it close a ticket or issue a refund on its own."
    watchOut: "Any tool that changes real data needs a human to approve it first."
  retrieval-and-grounding:
    story: "A shift handoff needs yesterday's outage facts."
    exampleAsk: "Summarize the outage doc from the binder, and quote the exact timestamps."
    watchOut: "Stale chat memory is not a source of truth — check the binder instead."
  human-craft:
    story: "A vague 'fix the bot' request lands in your inbox."
    exampleAsk: "Ask the helper to stop after planning. It's done when you have the root cause plus two fix options to choose from."
    watchOut: "Use plan mode first whenever production systems are involved."
  capstone-lab:
    story: "You want to tighten up your weekly status note workflow."
    exampleAsk: "Set up your research pack, a recipe card, and a verify checklist, then run the workflow once."
    watchOut: "Track how long it takes to get a first draft, before and after this change."
