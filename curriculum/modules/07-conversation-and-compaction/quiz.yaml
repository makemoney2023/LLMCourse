moduleId: conversation-and-compaction
questions:
  - id: q1
    prompt: What is compaction like?
    options:
      - id: a
        label: A short note so you can clear the desk
      - id: b
        label: Deleting the helper
      - id: c
        label: Adding more PDFs
      - id: d
        label: Turning off checks
    correctOptionId: a
    explanation: Compaction shrinks old clutter into a usable note.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - compaction
  - id: q2
    prompt: When should you restart?
    options:
      - id: a
        label: After every single word
      - id: b
        label: When the topic shifts or old junk keeps winning
      - id: c
        label: Never
      - id: d
        label: Only on weekends
    correctOptionId: b
    explanation: Restart with a handoff when the desk is contaminated.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - compaction
        - context-window
  - id: q3
    prompt: What should a handoff keep?
    options:
      - id: a
        label: Every raw log
      - id: b
        label: Only emojis
      - id: c
        label: Goal, done checks, sources, and do-not list
      - id: d
        label: Secrets
    correctOptionId: c
    explanation: Keep signal. Drop sludge.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - compaction
        - done-checks
  - id: q4
    prompt: Why are tool dumps risky in long chats?
    options:
      - id: a
        label: They shrink the desk forever
      - id: b
        label: They remove wall rules
      - id: c
        label: They ban research
      - id: d
        label: They use lots of desk space and can bury the goal
    correctOptionId: d
    explanation: Huge results crowd the context window.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - observation
        - context-window
  - id: q5
    prompt: What is the telltale smell of a contaminated chat?
    options:
      - id: a
        label: Old, wrong ideas keep coming back even after you correct them
      - id: b
        label: The chat is more than five messages long
      - id: c
        label: The helper asks a clarifying question
      - id: d
        label: A tool was used at some point
    correctOptionId: a
    explanation: When corrections stop sticking, the old context is winning. Time to compact or restart.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - compaction
        - context-window
  - id: q6
    prompt: How is compaction different from a handoff note?
    options:
      - id: a
        label: They are the same thing
      - id: b
        label: Handoffs happen automatically
      - id: c
        label: Compaction summarizes in place; a handoff is a note you write to start a fresh chat
      - id: d
        label: Compaction deletes your wall rules
    correctOptionId: c
    explanation: Compaction shrinks the current desk. A handoff clears it entirely and seeds a new one.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - compaction
  - id: q7
    prompt: What should you drop when writing a handoff?
    options:
      - id: a
        label: The goal
      - id: b
        label: Dead ends, raw logs, and rejected drafts
      - id: c
        label: The done checks
      - id: d
        label: Decisions that are already locked
    correctOptionId: b
    explanation: The next chat needs conclusions, not the journey. Sludge stays behind.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - compaction
        - done-checks
  - id: q8
    prompt: You need to debug one line inside a giant log. Better move than pasting it all?
    options:
      - id: a
        label: Paste it twice so it is definitely seen
      - id: b
        label: Describe the log from memory instead
      - id: c
        label: Nothing — bigger context is always better
      - id: d
        label: Extract the relevant lines and paste only those
    correctOptionId: d
    explanation: Ten relevant lines beat ten thousand noisy ones. The rest of the log buries the goal.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - context-window
        - desk-space
