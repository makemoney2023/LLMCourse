moduleId: deep-research
questions:
  - id: q1
    prompt: Why research before writing standing rules?
    options:
      - id: a
        label: So goals and words come from sources, not guesses
      - id: b
        label: Because one specific crawler tool is required
      - id: c
        label: To fill the desk with every page forever
      - id: d
        label: So you can skip checking later
    correctOptionId: a
    explanation: Research makes goals real. Rules from guesses encode the wrong problem.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - deep-research
        - hallucination
  - id: q2
    prompt: What belongs in a simple project pack?
    options:
      - id: a
        label: Only the chat scroll
      - id: b
        label: A short BRIEF.md and a SOURCES.md with links and dates
      - id: c
        label: Every raw page pasted into wall rules
      - id: d
        label: Secrets and API keys
    correctOptionId: b
    explanation: Short cited files beat scrollback and keep wall rules light.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - brief-md
        - sources-md
  - id: q3
    prompt: How should research files feed later chats?
    options:
      - id: a
        label: Paste the full crawl into every rule block
      - id: b
        label: Never save sources
      - id: c
        label: Save cited files; attach short parts when needed
      - id: d
        label: Turn every page into always-on rules
    correctOptionId: c
    explanation: Keep synthesis short. Pull pages from the binder when needed.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - context-pack
        - retrieval
  - id: q4
    prompt: Which research question is best?
    options:
      - id: a
        label: Tell me everything about software
      - id: b
        label: Research the future
      - id: c
        label: Find something cool
      - id: d
        label: What login steps do the official docs require?
    correctOptionId: d
    explanation: Narrow questions make useful sources.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - deep-research
        - context-pack
  - id: q5
    prompt: What belongs next to every link in SOURCES.md?
    options:
      - id: a
        label: Nothing — links speak for themselves
      - id: b
        label: A full copy of the page
      - id: c
        label: Your account password, for convenience
      - id: d
        label: The date you found it and one line on why it matters
    correctOptionId: d
    explanation: Dated, annotated links let anyone judge freshness and relevance without re-reading everything.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - sources-md
        - citation
  - id: q6
    prompt: What is the sign your research is done enough?
    options:
      - id: a
        label: You can write a one-page BRIEF a stranger could act on
      - id: b
        label: You have read every page on the topic
      - id: c
        label: The chat is over a hundred messages long
      - id: d
        label: You feel busy
    correctOptionId: a
    explanation: Research serves the brief. When the brief holds up without you in the room, you can stop.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - brief-md
        - deep-research
  - id: q7
    prompt: A new source contradicts your draft BRIEF. What now?
    options:
      - id: a
        label: Ignore the source — the brief is already written
      - id: b
        label: Update the brief and record the source with its date
      - id: c
        label: Delete SOURCES.md and start over
      - id: d
        label: Keep both versions and let the helper pick
    correctOptionId: b
    explanation: The brief follows the evidence. Conflicting facts left unresolved become confident wrong answers later.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - brief-md
        - sources-md
  - id: q8
    prompt: Why keep BRIEF.md short?
    options:
      - id: a
        label: Long briefs are against the rules
      - id: b
        label: Storage is expensive
      - id: c
        label: It shares desk space with everything else in the chat
      - id: d
        label: Short files cannot be cited
    correctOptionId: c
    explanation: The brief gets loaded again and again. Every extra page costs desk space in every future chat.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - brief-md
        - desk-space
