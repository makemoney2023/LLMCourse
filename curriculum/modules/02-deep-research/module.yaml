id: deep-research
order: 2
slug: deep-research
title: Deep research
subtitle: Find facts before you start the project
durationMinutes: 35
workshopSession: 1
prerequisites:
  - mental-model
objectives:
  - Explain why fact-finding first makes goals clearer.
  - Run a small research pass and save source links.
  - Make a short BRIEF.md and SOURCES.md pack for later use.
loopPlacement: Research sharpens your goal. It also makes files you can put on the desk later.
skipConsequence: You write rules from guesses. Later answers invent facts with no trail.
exerciseTitles:
  - Scope three research questions
  - Capture sources with links and dates
  - Write a short cited BRIEF.md
toolMapping:
  - abstraction: Deep research / web extract
    surfaces: Firecrawl, Perplexity-style research, Claude/ChatGPT deep research, browser agents, docs crawlers
  - abstraction: Cited context pack
    surfaces: Project BRIEF.md / research notes in repo, Notion/wiki pages, attached knowledge files
quizCount: 8

steps:
  - id: orient
    title: Get oriented
    headings: ["In plain words", "What this is", "Why it matters"]
  - id: ideas
    title: Big ideas
    headings: ["Big ideas"]
  - id: apply
    title: Put it to work
    headings:
      - "Where this sits in the loop"
      - "What goes wrong if you skip it"
      - "Where this shows up in tools"
      - "Tips"
