moduleId: system-instructions
questions:
  - id: q1
    prompt: What are standing instructions like?
    options:
      - id: a
        label: Rules on the classroom wall that apply every day
      - id: b
        label: A one-time joke in a single message
      - id: c
        label: A secret the helper never reads
      - id: d
        label: Only tool output
    correctOptionId: a
    explanation: Standing instructions guide every turn in that space.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - standing-instructions
  - id: q2
    prompt: What is ‘right altitude’ for wall rules?
    options:
      - id: a
        label: The longest document you can paste
      - id: b
        label: Clear limits without micromanaging every step
      - id: c
        label: No rules at all
      - id: d
        label: Only emoji rules
    correctOptionId: b
    explanation: Short, clear constraints beat novels and vibes.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - standing-instructions
        - standing-context
  - id: q3
    prompt: Where should long facts live?
    options:
      - id: a
        label: Inside every always-on rule
      - id: b
        label: Nowhere
      - id: c
        label: In BRIEF.md or SOURCES.md, not in huge wall text
      - id: d
        label: Only in your head
    correctOptionId: c
    explanation: Point to the pack. Keep the wall light.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - brief-md
        - sources-md
  - id: q4
    prompt: What should you do with fighting rules?
    options:
      - id: a
        label: Add both and hope
      - id: b
        label: Hide them
      - id: c
        label: Delete all tools
      - id: d
        label: Rewrite them into one clear rule
    correctOptionId: d
    explanation: Conflicts confuse the helper. Pick one.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - standing-instructions
        - system-instructions
  - id: q5
    prompt: How often should you revisit your wall rules?
    options:
      - id: a
        label: Never — rules are permanent
      - id: b
        label: Before every single message
      - id: c
        label: On a schedule, pruning rules nobody uses
      - id: d
        label: Only when you change tools
    correctOptionId: c
    explanation: Walls collect dead rules. A regular prune keeps the always-on text short and true.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - prune
        - standing-instructions
  - id: q6
    prompt: Which of these belongs as a wall rule?
    options:
      - id: a
        label: '"If a number is missing, ask — never invent it"'
      - id: b
        label: The full product pricing table
      - id: c
        label: Last week's meeting notes
      - id: d
        label: A forty-step deployment procedure
    correctOptionId: a
    explanation: Wall rules are short behaviors that apply to most tasks. Tables, notes, and procedures
      belong in files or playbooks.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - standing-instructions
        - playbook
  - id: q7
    prompt: What happens when the wall grows past a couple dozen rules?
    options:
      - id: a
        label: The helper reads them faster
      - id: b
        label: Every rule gets stronger
      - id: c
        label: Nothing — more rules always help
      - id: d
        label: Rules start losing to each other and to the task, and some get missed
    correctOptionId: d
    explanation: Attention is shared. A long wall means each rule matters less, and conflicts multiply.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - standing-instructions
        - context-window
  - id: q8
    prompt: 'Rules versus facts: which pairing is right?'
    options:
      - id: a
        label: Facts on the wall, rules in the binder
      - id: b
        label: Rules on the wall, facts in files like BRIEF.md
      - id: c
        label: Both belong in the chat scroll
      - id: d
        label: Neither should ever be written down
    correctOptionId: b
    explanation: The wall says how to behave. Files hold what is true. Mixing them bloats the wall and
      buries the facts.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - standing-instructions
        - brief-md
