moduleId: delegation
questions:
  - id: q1
    prompt: What is a subagent like?
    options:
      - id: a
        label: A specialist classmate with their own desk
      - id: b
        label: Unlimited wall rules
      - id: c
        label: A deleted source
      - id: d
        label: A secret key
    correctOptionId: a
    explanation: Specialists get scoped jobs and return results.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - subagent
  - id: q2
    prompt: What must a delegation contract include?
    options:
      - id: a
        label: Only emojis
      - id: b
        label: Goal, inputs, done checks, and a merge owner
      - id: c
        label: Every company file
      - id: d
        label: No boundaries
    correctOptionId: b
    explanation: Contracts prevent collisions and fuzzy work.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - delegation
        - done-checks
  - id: q3
    prompt: Which parallel plan is unsafe?
    options:
      - id: a
        label: One helper drafts while another reviews a copy
      - id: b
        label: Research on different sources
      - id: c
        label: Two helpers editing the same file with no owner
      - id: d
        label: One person merges at the end
    correctOptionId: c
    explanation: Shared mutable work needs a single owner.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - merge-owner
        - delegation
  - id: q4
    prompt: When should you NOT delegate yet?
    options:
      - id: a
        label: When inputs are clear
      - id: b
        label: When done checks exist
      - id: c
        label: When outputs do not overlap
      - id: d
        label: When the goal is still fuzzy
    correctOptionId: d
    explanation: Clarify first, then split.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - delegation
        - user-intent
  - id: q5
    prompt: What is an agent harness?
    options:
      - id: a
        label: The rules, tools, files, memory, approvals, logs, and checks around an agent
      - id: b
        label: Only the language model
      - id: c
        label: A list of every framework brand
      - id: d
        label: A private scratch note
    correctOptionId: a
    explanation: The harness is the workbench around the agent.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - agent-harness
        - agent
  - id: q6
    prompt: What belongs in a shared workspace?
    options:
      - id: a
        label: Every rejected personal draft
      - id: b
        label: Canonical sources, shared rules, handoffs, approvals, and ownership
      - id: c
        label: Unverified product memory
      - id: d
        label: Two editors on one file with no owner
    correctOptionId: b
    explanation: Teams share trusted defaults and clear ownership, not scratch work.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - shared-workspace
        - merge-owner
