moduleId: mental-model
questions:
  - id: q1
    prompt: What is an agent loop compared to a simple one-shot chat?
    options:
      - id: a
        label: The model can call tools, get results back, and keep thinking in the same chat
      - id: b
        label: The model remembers every chat you ever had with no limit
      - id: c
        label: You must send exactly one message per task
      - id: d
        label: Tools replace the need for desk space
    correctOptionId: a
    explanation: An agent loop goes in circles — think, call a tool, read the result, think again.
      Simple chat is text in, text out.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - agent
        - context-loop
  - id: q2
    prompt: Why is the context window like limited desk space?
    options:
      - id: a
        label: Models refuse to read more than one file per chat
      - id: b
        label: Rules, messages, files, and tool results all share the same limited space
      - id: c
        label: Only your messages count toward the limit
      - id: d
        label: Limits only apply on free plans
    correctOptionId: b
    explanation: Everything loaded into a session uses desk space. Quality often drops as the desk fills up.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - context-window
        - desk-space
  - id: q3
    prompt: Where does human verify fit in the loop?
    options:
      - id: a
        label: It only runs before your first message
      - id: b
        label: It replaces the need for tools
      - id: c
        label: You check the output, then your next request builds on what you learned
      - id: d
        label: You can skip it if the model sounds sure
    correctOptionId: c
    explanation: Verify means check work before turning it in. Fixes and approvals become your next intent.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - verify
        - user-intent
  - id: q4
    prompt: Which item is an observation in the loop?
    options:
      - id: a
        label: Your custom instructions in settings
      - id: b
        label: A note saved only in a notebook, never loaded
      - id: c
        label: The model's training data from before you chatted
      - id: d
        label: Text from a search tool added back into the chat
    correctOptionId: d
    explanation: Observations are tool and search results fed back onto the desk. Standing instructions
      are not observations.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - observation
        - agent
  - id: q5
    prompt: What happens as the desk fills up?
    options:
      - id: a
        label: The model gets faster
      - id: b
        label: Quality can drop — old clutter competes with your goal for attention
      - id: c
        label: Rules automatically delete themselves
      - id: d
        label: Nothing changes at any size
    correctOptionId: b
    explanation: Everything on the desk competes for attention. A crowded desk makes the goal harder to see.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - context-window
        - desk-space
  - id: q6
    prompt: Which of these is a one-shot chat, not an agent loop?
    options:
      - id: a
        label: The helper searches, reads results, then searches again
      - id: b
        label: The helper edits files and then runs the tests
      - id: c
        label: The helper checks a calendar tool and confirms a slot
      - id: d
        label: You ask one question and get one answer, no tools involved
    correctOptionId: d
    explanation: Text in, text out — with no tool calls and no observations — is simple chat, not a loop.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - agent
        - context-loop
  - id: q7
    prompt: What is user intent in the loop?
    options:
      - id: a
        label: The goal you state, which steers every later step
      - id: b
        label: The model's training data
      - id: c
        label: The menu of available tools
      - id: d
        label: A score the model gives your question
    correctOptionId: a
    explanation: Intent is the target. Every rule, tool call, and check exists to serve the goal you stated.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - user-intent
  - id: q8
    prompt: Why does the loop go in circles instead of a straight line?
    options:
      - id: a
        label: Models are too slow for straight lines
      - id: b
        label: Circles use more tokens on purpose
      - id: c
        label: Each tool result changes what the model should do next
      - id: d
        label: It only circles when something breaks
    correctOptionId: c
    explanation: Observations feed back into thinking. The model reads what came back and adjusts — that
      feedback is the whole point of the loop.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - observation
        - context-loop
