moduleId: mental-model
questions:
  - id: q1
    prompt: "What is an agent loop compared to a simple one-shot chat?"
    options:
      - id: a
        label: "The model can call tools, get results back, and keep thinking in the same chat"
      - id: b
        label: "The model remembers every chat you ever had with no limit"
      - id: c
        label: "You must send exactly one message per task"
      - id: d
        label: "Tools replace the need for desk space"
    correctOptionId: a
    explanation: "An agent loop goes in circles — think, call a tool, read the result, think again. Simple chat is text in, text out."

  - id: q2
    prompt: "Why is the context window like limited desk space?"
    options:
      - id: a
        label: "Rules, messages, files, and tool results all share the same limited space"
      - id: b
        label: "Models refuse to read more than one file per chat"
      - id: c
        label: "Only your messages count toward the limit"
      - id: d
        label: "Limits only apply on free plans"
    correctOptionId: a
    explanation: "Everything loaded into a session uses desk space. Quality often drops as the desk fills up."

  - id: q3
    prompt: "Where does human verify fit in the loop?"
    options:
      - id: a
        label: "You check the output, then your next request builds on what you learned"
      - id: b
        label: "It only runs before your first message"
      - id: c
        label: "It replaces the need for tools"
      - id: d
        label: "You can skip it if the model sounds sure"
    correctOptionId: a
    explanation: "Verify means check work before turning it in. Fixes and approvals become your next intent."

  - id: q4
    prompt: "Which item is an observation in the loop?"
    options:
      - id: a
        label: "Text from a search tool added back into the chat"
      - id: b
        label: "Your custom instructions in settings"
      - id: c
        label: "A note saved only in a notebook, never loaded"
      - id: d
        label: "The model's training data from before you chatted"
    correctOptionId: a
    explanation: "Observations are tool and search results fed back onto the desk. Standing instructions are not observations."
