moduleId: standing-playbooks
questions:
  - id: q1
    prompt: What is a playbook like?
    options:
      - id: a
        label: A recipe card you open for one kind of task
      - id: b
        label: A secret key
      - id: c
        label: Unlimited desk space
      - id: d
        label: A random joke
    correctOptionId: a
    explanation: Playbooks are on-demand procedures.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - playbook
  - id: q2
    prompt: What should stay always-on?
    options:
      - id: a
        label: Every workflow step you have ever used
      - id: b
        label: Short rules that are true for most tasks
      - id: c
        label: Whole websites
      - id: d
        label: Nothing
    correctOptionId: b
    explanation: Always-on text must stay small or it crowds the desk.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - standing-instructions
        - playbook
  - id: q3
    prompt: Where do long fact lists belong?
    options:
      - id: a
        label: In every always-on block
      - id: b
        label: Only in jokes
      - id: c
        label: In SOURCES.md or BRIEF.md, not in wall rules
      - id: d
        label: In tool names
    correctOptionId: c
    explanation: Facts are binder pages. Rules are wall text.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - sources-md
        - brief-md
  - id: q4
    prompt: Why do playbooks need triggers?
    options:
      - id: a
        label: So the desk becomes infinite
      - id: b
        label: So tools turn off
      - id: c
        label: So research is banned
      - id: d
        label: So people know when to pull the recipe card
    correctOptionId: d
    explanation: No trigger means the playbook stays unused.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - playbook
        - done-checks
  - id: q5
    prompt: What are done-when checks for in a playbook?
    options:
      - id: a
        label: Decoration at the bottom of the card
      - id: b
        label: Making the card look thorough
      - id: c
        label: Banning extra tools
      - id: d
        label: Letting anyone tell the job is finished without asking you
    correctOptionId: d
    explanation: Done-when checks make quality testable. Without them, "finished" is a feeling.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - done-checks
        - playbook
  - id: q6
    prompt: When is it time to write a new playbook?
    options:
      - id: a
        label: After every single chat, no matter what
      - id: b
        label: Around the third time you repeat the same kind of job
      - id: c
        label: Before you have ever tried the job once
      - id: d
        label: Never — playbooks are for factories
    correctOptionId: b
    explanation: Repetition is the signal. One-offs do not earn a card; the third repeat does.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - playbook
  - id: q7
    prompt: A playbook step keeps producing bad results. What do you do?
    options:
      - id: a
        label: Update the step — playbooks are living documents
      - id: b
        label: Delete the whole playbook
      - id: c
        label: Blame the helper and carry on
      - id: d
        label: Add ten extra steps just in case
    correctOptionId: a
    explanation: A failing step is feedback. Fix the card so the next run inherits the lesson.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - playbook
        - verify
  - id: q8
    prompt: How do playbooks save desk space?
    options:
      - id: a
        label: They compress the chat automatically
      - id: b
        label: They delete old tool results
      - id: c
        label: You load the card only when its trigger fires, not always
      - id: d
        label: They do not — playbooks always cost more space
    correctOptionId: c
    explanation: On-demand beats always-on. The card costs desk space only during the jobs that need it.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - playbook
        - desk-space
