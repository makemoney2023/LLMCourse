moduleId: memory-systems
questions:
  - id: q1
    prompt: What is memory like in this course?
    options:
      - id: a
        label: Sticky notes you keep for next time
      - id: b
        label: A bigger monitor
      - id: c
        label: A delete button for tools
      - id: d
        label: A kind of quiz
    correctOptionId: a
    explanation: Memory brings durable facts back later.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - memory
  - id: q2
    prompt: Where should important project facts live?
    options:
      - id: a
        label: Only in jokes
      - id: b
        label: In binder notes you control, like BRIEF.md
      - id: c
        label: Inside secrets vaults in the chat
      - id: d
        label: Nowhere
    correctOptionId: b
    explanation: Prefer auditable docs for important facts.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - binder
        - brief-md
  - id: q3
    prompt: What should never go in memory?
    options:
      - id: a
        label: Tone preferences
      - id: b
        label: Project links
      - id: c
        label: Secrets and API keys
      - id: d
        label: Open questions
    correctOptionId: c
    explanation: Secrets do not belong in prompts or memory.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - memory
        - never-list
  - id: q4
    prompt: Why prune memory?
    options:
      - id: a
        label: Pruning bans research
      - id: b
        label: Pruning removes the desk
      - id: c
        label: Pruning deletes BRIEF.md automatically
      - id: d
        label: Old wrong stickies can steer future chats
    correctOptionId: d
    explanation: Uncurated memory becomes slow pollution.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - prune
        - memory
  - id: q5
    prompt: Which is a good candidate for saved memory?
    options:
      - id: a
        label: An API key you use often
      - id: b
        label: A stable preference, like "plain words, short sentences"
      - id: c
        label: Today's half-finished draft
      - id: d
        label: A rumor you heard once
    correctOptionId: b
    explanation: Memory suits durable, low-risk preferences. Drafts change, secrets are forbidden, rumors are noise.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - memory
  - id: q6
    prompt: Chat memory versus binder files — which statement is right?
    options:
      - id: a
        label: They are identical
      - id: b
        label: Binder files are invisible to the helper
      - id: c
        label: Memory is for facts and files are for tone
      - id: d
        label: Memory is convenient, but files are auditable — prefer files for important facts
    correctOptionId: d
    explanation: You can read, diff, and fix a file. Hidden memory is harder to inspect and easier to trust wrongly.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - memory
        - binder
  - id: q7
    prompt: How do you find stale memory before it bites?
    options:
      - id: a
        label: Review saved memories on a schedule and delete what no longer holds
      - id: b
        label: Wait for a confusing failure, then dig
      - id: c
        label: Memory cannot go stale
      - id: d
        label: Ask the helper to guess which notes are old
    correctOptionId: a
    explanation: Same habit as wall rules — a regular prune. Stale notes steer silently until removed.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - prune
        - memory
  - id: q8
    prompt: The helper keeps "remembering" a decision you reversed last month. What went wrong?
    options:
      - id: a
        label: Nothing — that is expected behavior
      - id: b
        label: The desk is too big
      - id: c
        label: The old note was never pruned, so it still steers new chats
      - id: d
        label: Tools were turned off
    correctOptionId: c
    explanation: Reversed decisions must be removed from memory, or the old version keeps winning.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - prune
        - memory
