moduleId: verify-and-harden
questions:
  - id: q1
    prompt: What does verify mean here?
    options:
      - id: a
        label: Checking work before you use or send it
      - id: b
        label: Making text longer
      - id: c
        label: Deleting BRIEF.md
      - id: d
        label: Turning off the desk
    correctOptionId: a
    explanation: Verify closes the quality loop.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - verify
  - id: q2
    prompt: Which is a common failure?
    options:
      - id: a
        label: Having done checks
      - id: b
        label: Sure words with no source on the desk
      - id: c
        label: Using a short allow list
      - id: d
        label: Asking clarifying questions
    correctOptionId: b
    explanation: Ungrounded fluency is confident guessing.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - verify
        - hallucination
  - id: q3
    prompt: What is a basic safety habit?
    options:
      - id: a
        label: Approve every action without looking
      - id: b
        label: Enable every plugin
      - id: c
        label: Never put secrets in chats or memory
      - id: d
        label: Skip source checks
    correctOptionId: c
    explanation: Secrets and blind approvals create harm.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - never-list
        - approval
  - id: q4
    prompt: After a miss, what should you update?
    options:
      - id: a
        label: Nothing
      - id: b
        label: Only the font
      - id: c
        label: Delete all sources
      - id: d
        label: The playbook or wall rule that would catch it next time
    correctOptionId: d
    explanation: Harden the loop defaults.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - playbook
        - standing-instructions
  - id: q5
    prompt: What makes a done check actually useful?
    options:
      - id: a
        label: You can test it — "all links open" beats "make it good"
      - id: b
        label: It sounds inspiring
      - id: c
        label: Only you know what it means
      - id: d
        label: It is very long
    correctOptionId: a
    explanation: A check you cannot test is a wish. Testable checks let anyone verify, including the helper.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - done-checks
        - verify
  - id: q6
    prompt: What is a smart spot-check strategy for a long output?
    options:
      - id: a
        label: Read nothing and trust the tone
      - id: b
        label: Read everything twice, every time
      - id: c
        label: Verify the riskiest claims first — numbers, names, and anything you will act on
      - id: d
        label: Check only the introduction
    correctOptionId: c
    explanation: You cannot check everything, so check where being wrong costs the most.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - verify
        - citation
  - id: q7
    prompt: What is hardening, in plain words?
    options:
      - id: a
        label: Making the text harder to read
      - id: b
        label: Turning each miss into a default — a rule, check, or playbook step that catches it next time
      - id: c
        label: Locking your computer at night
      - id: d
        label: Refusing all software updates
    correctOptionId: b
    explanation: Verification finds the miss once. Hardening makes sure the same miss cannot sneak by twice.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - verify
        - playbook
  - id: q8
    prompt: The helper says "all tests pass" but shows no output. What do you do?
    options:
      - id: a
        label: Ship it — it sounds done
      - id: b
        label: Say thanks and move on
      - id: c
        label: Ask again more nicely
      - id: d
        label: Ask for the actual output — evidence before claims
    correctOptionId: d
    explanation: Claims without evidence are the softest spot in the loop. Make "show the output" a reflex.
    remediation:
      lessonHeading: Big ideas
      glossaryIds:
        - verify
        - hallucination
